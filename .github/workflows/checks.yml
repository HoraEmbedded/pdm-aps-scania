name: Scania APS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inference and test dependencies
        run: python -m pip install -r requirements-serve.txt "pytest>=8,<9"
      - name: Verify documentation
        run: python scripts/check_documents.py
      - name: Rebuild the demonstrator
        run: |
          bash scripts/download_data.sh
          python scripts/prepare_demo.py
      - name: Run the test suite and compare reference predictions
        run: |
          python -m pytest -q
          python scripts/check_port.py
